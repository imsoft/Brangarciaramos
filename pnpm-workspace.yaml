# Pin patched versions of transitive build-time deps flagged by `pnpm audit`.
overrides:
  browserslist: ">=4.28.7"
  "@babel/core": ">=7.29.1"
  baseline-browser-mapping: ">=2.11.0"
  "brace-expansion@1": ">=1.1.18"
  "brace-expansion@>=3": ">=5.0.9"

allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  sharp: true
  unrs-resolver: true
